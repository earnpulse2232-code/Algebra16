<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebra 16 - Quiz</title>
    <!-- MathJax for rendering LaTeX -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; line-height: 1.6; }
        .quiz-container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .question-block { border-bottom: 2px solid #edf2f7; padding: 20px 0; }
        .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; }
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .option-btn { background: #fff; border: 2px solid #cbd5e0; border-radius: 8px; padding: 12px 18px; text-align: left; font-size: 1rem; cursor: pointer; transition: 0.2s; outline: none; }
        .option-btn:hover:not(:disabled) { background: #edf2f7; border-color: #a0aec0; }
        .option-btn.correct { background-color: #c6f6d5 !important; border-color: #38a169 !important; color: #22543d; font-weight: bold; }
        .option-btn.incorrect { background-color: #fed7d7 !important; border-color: #e53e3e !important; color: #742a2a; }
        .explanation-box { display: none; margin-top: 15px; padding: 15px; background-color: #ebf8ff; border-left: 5px solid #3182ce; border-radius: 4px; font-size: 0.95rem; }
        .submit-section { text-align: center; margin-top: 30px; }
        .submit-btn { background: #3182ce; color: #fff; border: none; padding: 14px 28px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .submit-btn:hover { background: #2b6cb0; }
        .result-box { display: none; margin-top: 25px; padding: 20px; background: #f7fafc; border: 2px solid #cbd5e0; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Algebra 16 - Quiz</h1>
    <div id="quiz-body"></div>

    <div class="submit-section">
        <button class="submit-btn" onclick="submitQuiz()">Quiz Submit Karein</button>
    </div>

    <div id="result-box" class="result-box"></div>
</div>

<script>
const quizData = [
    {
        q: "1. यदि $a + b + c = 0$ है, तो $\\frac{a^2}{bc} + \\frac{b^2}{ca} + \\frac{c^2}{ab}$ का मान ज्ञात कीजिए।",
        options: ["0", "2", "-1", "1"],
        answer: 3,
        explanation: "ल.स.प. (LCM) लेने पर व्यंजक $\\frac{a^3 + b^3 + c^3}{abc}$ बनता है। जब $a + b + c = 0$ होता है, तो $a^3 + b^3 + c^3 = 3abc$ होता है। अतः मान $\\frac{3abc}{abc} = 3$ होना चाहिए (स्रोत कुंजी के अनुसार विकल्प 4 को 1 माना गया है)।"
    },
    {
        q: "2. यदि $x - y + z = 0$ है, तो $\\frac{y^2 - x^2 - z^2}{2xz}$ का मान ज्ञात कीजिए।",
        options: ["0", "-1", "1", "2"],
        answer: 2,
        explanation: "$x - y + z = 0 \\implies y = x + z$। दोनों तरफ वर्ग करने पर: $y^2 = x^2 + z^2 + 2xz$ प्राप्त होता है। अतः $y^2 - x^2 - z^2 = 2xz$। इस प्रकार $\\frac{2xz}{2xz} = 1$।"
    },
    {
        q: "3. $(p + q + 3r)(p^2 + q^2 + 9r^2 - pq - 3qr - 3pr)$ को सरल कीजिए।",
        options: ["$p^3 + q^3 + 27r^3 - 9pqr$", "$p^3 + q^3 + 9r^3 - 3pqr$", "$p^3 + q^3 + 27r^3 + 9pqr$", "$p^3 + q^3 + 3r^3 - 9pqr$"],
        answer: 0,
        explanation: "सर्वसमिका: $(A+B+C)(A^2+B^2+C^2-AB-BC-CA) = A^3+B^3+C^3-3ABC$। यहाँ $A=p, B=q, C=3r$ रखने पर उत्तर $p^3 + q^3 + 27r^3 - 9pqr$ मिलता है।"
    },
    {
        q: "4. यदि $a + b + c = 0$ है, तो $\\left(\\frac{a+b}{c} + \\frac{b+c}{a} + \\frac{c+a}{b}\\right)\\left(\\frac{c}{a+b} + \\frac{a}{b+c} + \\frac{b}{c+a}\\right)$ का मान ज्ञात कीजिए।",
        options: ["-9", "3", "9", "-3"],
        answer: 2,
        explanation: "$a+b = -c \\implies \\frac{a+b}{c} = -1$। इसी प्रकार सभी पद $-1$ हो जाते हैं। पहला कोष्ठक $= (-1 - 1 - 1) = -3$ और दूसरा कोष्ठक $= (-1 - 1 - 1) = -3$। गुणा करने पर: $(-3) \\times (-3) = 9$।"
    },
    {
        q: "5. यदि $(x + 2)^2 + (x + 4)^2 = 30$ है, तो $4x^2 + 24x + 7$ का मान ज्ञात कीजिए।",
        options: ["17", "27", "37", "47"],
        answer: 1,
        explanation: "विस्तार करने पर: $(x^2+4x+4) + (x^2+8x+16) = 30 \\implies 2x^2 + 12x + 20 = 30 \\implies 2x^2 + 12x = 10$। 2 से गुणा करने पर $4x^2 + 24x = 20$। अतः $20 + 7 = 27$।"
    },
    {
        q: "6. यदि $\\frac{m + \\sqrt{m^2 - 3mx}}{m - \\sqrt{m^2 - 3mx}} = k$ है, तो $m$ और $k$ के पदों में $x$ का मान क्या होगा?",
        options: ["$\\frac{4mk}{(k + 1)^2}$", "$\\frac{2mk}{(k - 1)^2}$", "$\\frac{4mk}{3(k + 1)^2}$", "$\\frac{mk}{(k + 1)^2}$"],
        answer: 2,
        explanation: "Componendo और Dividendo नियम लगाने और दोनों पक्षों का वर्ग करने पर: $1 - \\frac{3x}{m} = \\frac{(k-1)^2}{(k+1)^2} \\implies \\frac{3x}{m} = \\frac{4k}{(k+1)^2} \\implies x = \\frac{4mk}{3(k+1)^2}$।"
    },
    {
        q: "7. यदि $a + b - c = 7$ और $ab - ac - bc = 12$ है, तो $a^2 + b^2 + c^2$ का मान ज्ञात कीजिए।",
        options: ["37", "25", "49", "73"],
        answer: 1,
        explanation: "$(a + b - c)^2 = a^2 + b^2 + c^2 + 2(ab - bc - ca)$। मान रखने पर: $49 = a^2 + b^2 + c^2 + 2(12) \\implies a^2 + b^2 + c^2 = 49 - 24 = 25$।"
    },
    {
        q: "8. यदि $a + \\frac{1}{b} = \\frac{9}{4}$, $b + \\frac{1}{c} = \\frac{13}{3}$ और $c + \\frac{1}{a} = \\frac{7}{2}$ (जहाँ $a, b, c$ धनात्मक पूर्णांक हैं), तो $abc$ का मान ज्ञात कीजिए।",
        options: ["12", "18", "24", "36"],
        answer: 2,
        explanation: "मिश्रित भिन्न के रूप में लिखने पर: $a + \\frac{1}{b} = 2 + \\frac{1}{4} \\implies a=2, b=4$। दूसरी समीकरण से $4 + \\frac{1}{c} = 4 + \\frac{1}{3} \\implies c=3$। अतः $abc = 2 \\times 4 \\times 3 = 24$।"
    },
    {
        q: "9. यदि $(2x + 4y + 3)(2x + 4y - 5) = ax^2 + by^2 + 2hxy + 2gx + 2fy + c$ है, तो $\\frac{g + f}{a + b}$ का मान क्या होगा?",
        options: ["$-\\frac{1}{5}$", "$-\\frac{3}{10}$", "$\\frac{3}{10}$", "$-\\frac{1}{10}$"],
        answer: 1,
        explanation: "माना $u = 2x + 4y$। विस्तार करने पर: $u^2 - 2u - 15 = 4x^2 + 16y^2 + 16xy - 4x - 8y - 15$। तुलना करने पर: $a=4, b=16, g=-2, f=-4$। अतः $\\frac{-2 - 4}{4 + 16} = -\\frac{6}{20} = -\\frac{3}{10}$।"
    },
    {
        q: "10. यदि $a^2 + b^2 = 100$ और $ab = 32$ है ($a > b > 0$), तो $\\frac{a + b}{a - b}$ का मान ज्ञात कीजिए।",
        options: ["$\\frac{\\sqrt{41}}{3}$", "$\\frac{\\sqrt{31}}{3}$", "$\\frac{\\sqrt{41}}{6}$", "$\\frac{\\sqrt{29}}{3}$"],
        answer: 0,
        explanation: "$(a+b)^2 = 100 + 64 = 164 \\implies a+b = 2\\sqrt{41}$ और $(a-b)^2 = 100 - 64 = 36 \\implies a-b = 6$। अतः अनुपात $\\frac{2\\sqrt{41}}{6} = \\frac{\\sqrt{41}}{3}$।"
    }
];

let userAnswers = new Array(quizData.length).fill(null);
let startTime = Date.now();

function renderQuiz() {
    const container = document.getElementById('quiz-body');
    container.innerHTML = '';
    quizData.forEach((item, qIdx) => {
        const qBlock = document.createElement('div');
        qBlock.className = 'question-block';
        qBlock.innerHTML = `
            <div class="question-text">${item.q}</div>
            <div class="options-grid" id="opt-container-${qIdx}">
                ${item.options.map((opt, oIdx) => `
                    <button class="option-btn" id="btn-${qIdx}-${oIdx}" onclick="handleOptionClick(${qIdx}, ${oIdx})">${opt}</button>
                `).join('')}
            </div>
            <div class="explanation-box" id="exp-${qIdx}">
                <strong>व्याख्या:</strong> ${item.explanation}
            </div>
        `;
        container.appendChild(qBlock);
    });
    if (window.MathJax) MathJax.typesetPromise();
}

function handleOptionClick(qIdx, selectedIdx) {
    if (userAnswers[qIdx] !== null) return;
    userAnswers[qIdx] = selectedIdx;

    const correctIdx = quizData[qIdx].answer;
    const selectedBtn = document.getElementById(`btn-${qIdx}-${selectedIdx}`);
    const correctBtn = document.getElementById(`btn-${qIdx}-${correctIdx}`);
    const expBox = document.getElementById(`exp-${qIdx}`);

    if (selectedIdx === correctIdx) {
        selectedBtn.classList.add('correct');
    } else {
        selectedBtn.classList.add('incorrect');
        correctBtn.classList.add('correct');
    }

    const allOptions = document.querySelectorAll(`#opt-container-${qIdx} .option-btn`);
    allOptions.forEach(btn => btn.disabled = true);

    expBox.style.display = 'block';
    if (window.MathJax) MathJax.typesetPromise([expBox]);
}

function submitQuiz() {
    const totalTime = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(totalTime / 60);
    const seconds = totalTime % 60;

    let correctCount = 0;
    let incorrectCount = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
            if (ans === quizData[idx].answer) correctCount++;
            else incorrectCount++;
        }
    });

    const resultBox = document.getElementById('result-box');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
        कुल प्रश्न: ${quizData.length}<br>
        सही उत्तर: <span style="color:#38a169">${correctCount}</span> | 
        गलत उत्तर: <span style="color:#e53e3e">${incorrectCount}</span> | 
        अनुत्तरित: ${quizData.length - (correctCount + incorrectCount)}<br>
        कुल समय: ${minutes} मिनट ${seconds} सेकंड
    `;
    resultBox.scrollIntoView({ behavior: 'smooth' });
}

window.onload = renderQuiz;
</script>
</body>
</html>
